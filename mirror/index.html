<!DOCTYPE html>
<!--
  cactus mirror browser dashboard. Served at the mirror root (e.g. /)
  by mirror/server.go via go:embed. Pure HTML/CSS/JS, no dependencies.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>cactus mirror</title>
<style>
  :root {
    --bg: #0f1419; --panel: #1a2029; --fg: #d6dde6; --muted: #8794a3;
    --accent: #5cc8a8; --accent2: #7aa2f7; --border: #2a323d; --warn: #e0af68;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 1.5rem; background: var(--bg); color: var(--fg);
    font: 14px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  h1 { font-size: 1.3rem; margin: 0 0 .25rem; }
  h2 { font-size: 1rem; margin: 0 0 .75rem; color: var(--accent); }
  a { color: var(--accent2); text-decoration: none; }
  a:hover { text-decoration: underline; }
  .wrap { max-width: 1100px; margin: 0 auto; }
  .sub { color: var(--muted); margin: 0 0 1.5rem; word-break: break-all; }
  .panel {
    background: var(--panel); border: 1px solid var(--border);
    border-radius: 8px; padding: 1rem 1.25rem; margin-bottom: 1.25rem;
  }
  .grid { display: grid; grid-template-columns: max-content 1fr; gap: .35rem 1rem; }
  .grid dt { color: var(--muted); }
  .grid dd { margin: 0; word-break: break-all; }
  .big { font-size: 1.8rem; font-weight: 600; color: var(--accent); }
  code, .mono { font-family: ui-monospace, "SF Mono", Menlo, monospace; }
  button, input, select {
    font: inherit; background: #11161d; color: var(--fg);
    border: 1px solid var(--border); border-radius: 6px; padding: .4rem .6rem;
  }
  button { cursor: pointer; background: #232c38; }
  button:hover { border-color: var(--accent); }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  .row label { color: var(--muted); }
  .out {
    margin-top: .9rem; background: #0b0f14; border: 1px solid var(--border);
    border-radius: 6px; padding: .75rem; overflow-x: auto;
    font-family: ui-monospace, monospace; font-size: 12px; white-space: pre;
  }
  .err { color: #f7768e; }
  .ok { color: var(--accent); }
  .note { color: var(--muted); font-size: 12px; margin-top: .5rem; }
  .hint { color: var(--muted); font-size: 12px; }

  /* Custom copy button styling aligned with theme */
  .copy-wrapper {
    position: relative;
  }
  .copy-btn {
    position: absolute;
    top: 0.5rem;
    right: 0.5rem;
    font-size: 11px;
    padding: 0.2rem 0.4rem;
  }
  .copy-btn.copied {
    border-color: var(--accent);
    color: var(--accent);
  }

  /* Upstream card layout */
  .upstream-card {
    border-top: 1px solid var(--border);
    padding-top: 1rem;
    margin-top: 1rem;
  }
  .upstream-card:first-child {
    border-top: none;
    padding-top: 0;
    margin-top: 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>cactus mirror</h1>
  <p class="sub">tlog-witness replication & cosigning</p>

  <div class="panel">
    <h2>Mirror Node</h2>
    <dl class="grid">
      <dt>Cosigner ID</dt><dd class="mono" id="cosigner-id">loading…</dd>
      <dt>Signing Algorithm</dt><dd id="algorithm">loading…</dd>
      <dt>Resource</dt><dd><a href="config" target="_blank">config</a></dd>
    </dl>
    <div class="row" style="margin-top:0.75rem">
      <button id="refresh" onclick="refreshDashboard()">Refresh</button>
      <span id="status" class="hint"></span>
    </div>
  </div>

  <div class="panel">
    <h2>Public Key</h2>
    <div class="copy-wrapper">
      <button class="copy-btn" onclick="copyPublicKey()">Copy</button>
      <div id="pub-key-pem" class="out">loading…</div>
    </div>
  </div>

  <div class="panel">
    <h2>Followed Upstream Logs</h2>
    <div id="upstreams-container">
      <p class="hint">Loading upstream logs…</p>
    </div>
  </div>

  <p class="note">cactus monitoring read-path · tlog-witness dashboard</p>
</div>

<script>
  let mirrorConfig = null;

  async function loadConfig() {
    const statusEl = document.getElementById("status");
    statusEl.textContent = "fetching config…";
    statusEl.className = "hint";
    try {
      const r = await fetch("config", { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      mirrorConfig = await r.json();
      
      document.getElementById("cosigner-id").textContent = mirrorConfig.cosigner_id || "—";
      document.getElementById("algorithm").textContent = (mirrorConfig.algorithm || "—").toUpperCase();
      document.getElementById("pub-key-pem").textContent = mirrorConfig.public_key_pem || "—";
      
      statusEl.innerHTML = '<span class="ok">updated ' + new Date().toLocaleTimeString() + "</span>";
      renderUpstreams(mirrorConfig.upstreams || []);
    } catch (e) {
      statusEl.innerHTML = '<span class="err">config error: ' + String(e.message) + '</span>';
      document.getElementById("cosigner-id").textContent = "Error loading config";
      document.getElementById("pub-key-pem").textContent = e.message;
      console.error(e);
    }
  }

  // Render the followed upstreams inside the Panel
  function renderUpstreams(upstreams) {
    const container = document.getElementById("upstreams-container");
    container.innerHTML = "";
    
    if (upstreams.length === 0) {
      container.innerHTML = '<p class="hint">No upstream logs configured.</p>';
      return;
    }

    upstreams.forEach((u, i) => {
      const card = document.createElement("div");
      card.className = "upstream-card";
      
      const escapedOrigin = "oid/1.3.6.1.4.1." + encodeURIComponent(u.log_id);
      const checkpointPath = escapedOrigin + "/checkpoint";
      
      card.innerHTML = `
        <h3 style="font-size: 1rem; margin: 0 0 0.5rem; display: flex; justify-content: space-between; align-items: center;">
          <span class="mono">${u.log_id}</span>
          <span id="sync-status-${i}" class="hint">sync status: querying…</span>
        </h3>
        <dl class="grid">
          <dt>Tile URL</dt><dd class="mono">${u.tile_url}</dd>
          <dt>CA Cosigner ID</dt><dd class="mono">${u.ca_cosigner_id}</dd>
          <dt>Tree Size</dt><dd id="tree-size-${i}">—</dd>
          <dt>Root Hash</dt><dd class="mono" id="root-hash-${i}">—</dd>
          <dt>Resource</dt><dd><a href="${checkpointPath}" target="_blank">mirror checkpoint for this log</a></dd>
        </dl>
      `;
      
      container.appendChild(card);
      fetchCheckpoint(checkpointPath, i);
    });
  }

  async function fetchCheckpoint(path, idx) {
    const statusEl = document.getElementById(`sync-status-${idx}`);
    try {
      const r = await fetch(path, { cache: "no-store" });
      if (!r.ok) throw new Error("HTTP " + r.status);
      const text = await r.text();
      
      const lines = text.split("\n");
      const size = parseInt(lines[1] || "0", 10);
      const root = lines[2] || "";
      
      document.getElementById(`tree-size-${idx}`).textContent = size.toLocaleString() + " entries";
      document.getElementById(`root-hash-${idx}`).textContent = root;
      
      statusEl.innerHTML = '<span class="ok">synced</span>';
    } catch (e) {
      statusEl.innerHTML = '<span class="err">error: ' + String(e.message) + '</span>';
      console.error(e);
    }
  }

  function copyPublicKey() {
    const pem = document.getElementById("pub-key-pem").textContent;
    navigator.clipboard.writeText(pem).then(() => {
      const btn = document.querySelector(".copy-btn");
      btn.textContent = "Copied!";
      btn.classList.add("copied");
      setTimeout(() => {
        btn.textContent = "Copy";
        btn.classList.remove("copied");
      }, 2000);
    }).catch(err => {
      console.error('Failed to copy text: ', err);
    });
  }

  function refreshDashboard() {
    loadConfig();
  }

  // Initial load
  loadConfig();
</script>
</body>
</html>
